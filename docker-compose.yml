services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rh-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/dump.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - rh-network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10

    # Bind to localhost only - not exposed to internet
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  # Spring Boot Backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: rh-backend
    restart: unless-stopped

    environment:
      # Load from .env file
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Pointage/retards calcules avec l'heure locale de l'entreprise (pas UTC)
      TZ: ${TZ:-Africa/Tunis}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Africa/Tunis}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      FRONTEND_URL: ${FRONTEND_URL}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SECURITY: ${MAIL_SECURITY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Antigone RH}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_PATH: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_PATH}
      GOOGLE_DRIVE_CLIENT_VIEWER_KEY_PATH: ${GOOGLE_DRIVE_CLIENT_VIEWER_KEY_PATH}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${GOOGLE_DRIVE_PARENT_FOLDER_ID}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI}

    volumes:
      # Upload directory for persistence
      - uploads:/app/uploads
      # Logs directory
      - logs:/app/logs
      # Tokens directory for Google Drive
      - tokens:/app/tokens
      # Optional: Mount Google Drive service account keys if they exist
      - ./secrets/service-account.json:/app/service-account.json:ro
      - ./secrets/client-viewer-service-account.json:/app/client-viewer-service-account.json:ro
    ports:
      # Expose backend only on localhost - Nginx will proxy it
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - rh-network

    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8080/actuator/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx serving both React apps (rh.* and project.*) + proxying /api and /uploads to backend
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        RH_APP_URL: ${RH_APP_URL:-https://rh.antigoneinterne.agency}
        PROJECTS_APP_URL: ${PROJECTS_APP_URL:-https://project.antigoneinterne.agency}
    container_name: rh-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - rh-network
    ports:
      # Host nginx (TLS) proxies project.* and rh.* to this port
      - "127.0.0.1:${FRONTEND_PORT:-8083}:80"

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local
  tokens:
    driver: local

networks:
  rh-network:
    driver: bridge
