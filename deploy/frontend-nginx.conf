# Inside the "frontend" container. Backend reachable as rh-backend:8080 on the compose network.
map $http_x_forwarded_proto $app_scheme { default $scheme; https https; }

upstream backend { server backend:8080; }

# Shared proxy rules are repeated per server (nginx has no cross-server include without a file).
server {
    listen 80 default_server;
    server_name ~^project\. project.antigoneinterne.agency;
    root /usr/share/nginx/html/projects;
    index index.html;
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $app_scheme;
        proxy_read_timeout 120s;
    }
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name ~^rh\. rh.antigoneinterne.agency;
    root /usr/share/nginx/html/rh;
    index index.html;
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $app_scheme;
        proxy_read_timeout 120s;
    }
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
