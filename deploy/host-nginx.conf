# Host nginx on the Hostinger VPS: /etc/nginx/sites-available/antigone
# TLS terminates here; both subdomains go to the "frontend" container (127.0.0.1:8083),
# which serves the right app by Host header and proxies /api + /uploads to the backend.

server {
    listen 80;
    listen [::]:80;
    server_name project.antigoneinterne.agency rh.antigoneinterne.agency;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name project.antigoneinterne.agency rh.antigoneinterne.agency;

    # One certificate covering both names:
    #   sudo certbot certonly --nginx -d project.antigoneinterne.agency -d rh.antigoneinterne.agency
    ssl_certificate     /etc/letsencrypt/live/project.antigoneinterne.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/project.antigoneinterne.agency/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
